name: Discovery CI

on:
  pull_request:
    paths:
      - "scripts/discover_search_frontends.py"
      - "tests/test_discover_search_frontends_smoke.py"
      - ".github/workflows/discover-search-frontends.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Discovery tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Validate Python syntax
        run: python -m py_compile scripts/discover_search_frontends.py tests/test_discover_search_frontends_smoke.py

      - name: Run discovery smoke tests
        run: python tests/test_discover_search_frontends_smoke.py
