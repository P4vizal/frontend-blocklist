name: Discover frontend domains

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/discover_search_frontends.py"
      - ".github/workflows/discover-search-frontends.yml"
      - "tests/test_discover_search_frontends_smoke.py"
  schedule:
    - cron: "41 3 * * *"

permissions:
  contents: read

concurrency:
  group: discover-search-frontends
  cancel-in-progress: true

jobs:
  quality:
    name: Discovery tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Validate Python syntax
        run: python -m py_compile scripts/discover_search_frontends.py tests/test_discover_search_frontends_smoke.py
      - name: Run discovery smoke tests
        run: python tests/test_discover_search_frontends_smoke.py

  discover:
    name: Frontend discovery
    needs: quality
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Snapshot protected files
        shell: bash
        run: |
          set -euo pipefail
          protected_files=(
            "scripts/generate_blocklist.py"
            "blocklist.txt"
            "portmaster.txt"
            "hagezi-overlap.txt"
          )
          snapshot="$RUNNER_TEMP/frontend-discovery-protected-sha256"
          : > "$snapshot"
          for path in "${protected_files[@]}"; do
            test -f "$path"
            printf '%s  %s\n' "$(git rev-parse "HEAD:$path")" "$path" >> "$snapshot"
          done
          echo "Protected file baseline:"
          cat "$snapshot"

      - name: Discover and validate domains
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          URLSCAN_API_KEY: ${{ secrets.URLSCAN_API_KEY }}
          DISCOVERY_MODE: daily
        run: python scripts/discover_search_frontends.py

      - name: Verify discovery outputs and protected files
        shell: bash
        run: |
          set -euo pipefail
          snapshot="$RUNNER_TEMP/frontend-discovery-protected-sha256"

          while read -r expected path; do
            actual="$(git hash-object "$path")"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::Protected file changed: $path"
              echo "Expected blob: $expected"
              echo "Actual blob:   $actual"
              git diff -- "$path" || true
              exit 1
            fi
          done < "$snapshot"

          find . -type d -name "__pycache__" -prune -exec rm -rf {} +

          mapfile -t changed < <(git status --porcelain=v1 --untracked-files=all)
          for entry in "${changed[@]}"; do
            path="${entry:3}"
            case "$path" in
              search-discovered-blocklist.txt|search-discovered-report.json) ;;
              "")
                ;;
              *)
                echo "::error::Unexpected working-tree change: $path"
                exit 1
                ;;
            esac
          done

          git diff --check

          python - <<'PY'
          import json
          import re
          from pathlib import Path

          report_path = Path("search-discovered-report.json")
          output_path = Path("search-discovered-blocklist.txt")
          static_rules = set()

          report = json.loads(report_path.read_text(encoding="utf-8"))
          assert int(report.get("validation_crash_count", 0)) == 0, (
              f"Discovery validator crashes: {report.get('validation_crash_count')}"
          )
          assert int(report.get("pending_verification_count", 0)) <= 120
          assert int(report.get("report_schema_version", 0)) == 2
          assert int(report.get("validated_candidates", 0)) <= int(
              report.get("candidates_discovered", 0)
          )
          if report.get("discovery_mode") == "daily":
              assert int(report.get("search_queries", 0)) == 72
          assert int(report.get("search_backend_failures", 0)) >= 0
          assert int(report.get("pending_verification_count", 0)) <= 120
          assert int(report.get("retained_total_count", 0)) == int(
              report.get("output_domain_count", report.get("retained_total_count", 0))
          )
          required_report_keys = {
              "status", "trusted_candidate_count", "validated_candidates",
              "pending_verification_count", "validation_crash_count",
              "search_backend_failures", "audited_false_positive_count",
              "trusted_source_health",
          }
          missing = sorted(required_report_keys - set(report))
          assert not missing, f"Discovery report missing keys: {missing}"

          old_output = set()
          for raw in __import__("subprocess").check_output(
              ["git", "show", "HEAD:search-discovered-blocklist.txt"], text=True
          ).splitlines():
              line = raw.strip()
              if line.startswith("||") and line.endswith("^") and line != "||*.st^":
                  old_output.add(line[2:-1])

          new_output = set()
          new_output_lines = []
          bad = []
          for line_no, raw in enumerate(output_path.read_text(encoding="utf-8").splitlines(), 1):
              line = raw.strip()
              if not line or line.startswith("#"):
                  continue
              if line in static_rules:
                  continue
              if not re.fullmatch(r"\|\|[^\^/\s]+\^", line):
                  bad.append((line_no, raw))
              else:
                  domain = line[2:-1]
                  new_output.add(domain)
                  new_output_lines.append(domain)
          assert not bad, f"Malformed discovery output lines: {bad[:5]}"
          output_lines = set(output_path.read_text(encoding="utf-8").splitlines())
          assert static_rules <= output_lines, f"Missing static block rules: {sorted(static_rules - output_lines)}"
          assert new_output_lines == sorted(new_output_lines), "Discovery output is not sorted"
          assert len(new_output_lines) == len(new_output), "Discovery output contains duplicate domains"
          audited_false_positives = set(report.get("audited_false_positive_domains", []))
          removed = old_output - new_output
          assert removed <= audited_false_positives, (
              f"Discovery output removed non-audited domains: {sorted(removed - audited_false_positives)[:10]}"
          )
          if report.get("status") == "no_update":
              assert old_output == new_output, "no_update run changed the discovery list"
          assert len(new_output) == sum(
              1
              for raw in output_path.read_text(encoding="utf-8").splitlines()
              if (
                  raw.strip()
                  and not raw.strip().startswith("#")
                  and raw.strip() not in static_rules
              )
          )
          print("Discovery outputs, audit guard, and protected files verified.")
          PY

      - name: Commit discovered list and report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add search-discovered-blocklist.txt search-discovered-report.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update discovered frontend domains"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            sleep 2
          done

          echo "Unable to push after 5 attempts."
          exit 1
