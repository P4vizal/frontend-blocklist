name: Discover frontend domains

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/discover_search_frontends.py"
  schedule:
    - cron: "41 3 * * *"

permissions:
  contents: write

concurrency:
  group: discover-search-frontends
  cancel-in-progress: true

jobs:
  discover:
    name: Frontend discovery
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate Python syntax
        run: |
          python - <<PY
          import ast
          from pathlib import Path

          path = Path("scripts/discover_search_frontends.py")
          ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          print(f"Python syntax OK: {path}")
          PY

      - name: Runtime smoke test
        run: |
          python - <<'PY'
          import scripts.discover_search_frontends as discovery

          candidates = {}
          discovery.merge_search_result(
              candidates,
              "twitter",
              "twitter viewer alternative to nitter",
              "bing-rss",
              {
                  "href": "https://example.com/view",
                  "title": "Twitter viewer",
                  "body": "viewer",
              },
          )
          assert ("twitter", "example.com") in candidates
          assert candidates[("twitter", "example.com")].providers == ["bing-rss"]
          queries = discovery.build_queries()
          assert queries
          assert len(discovery.active_search_languages()) == 4
          assert discovery.search_pages_for("en", "twitter viewer alternatives to nitter") == (1, 2)
          fr_pages = discovery.search_pages_for("fr", "twitter viewer")
          assert fr_pages in ((1,), (1, 2))
          assert len(set(queries)) == len(queries)
          parser = discovery.PageParser()
          parser.feed(
              '<html><head><title>Reddit Viewer</title></head>'
              '<body><h1>Reddit <span>Viewer</span></h1>'
              '<div role="textbox" aria-label="Search subreddit"></div>'
              '<article>post</article></body></html>'
          )
          parsed = parser.result()
          assert "reddit viewer" in parsed["title"].lower()
          assert "reddit viewer" in parsed["headings"].lower()
          assert parsed["inputs"] >= 1
          assert parsed["article_count"] == 1

          multilingual = discovery.SearchHit(
              "example.org", "reddit", ["query"], ["https://example.org/"], [], ["bing-rss"],
              ["bing-rss:reddit 查看器 用于浏览 subreddit"],
          )
          assert discovery.search_result_has_strong_service_evidence(multilingual)
          assert discovery.DISCOVERY_MODE == "daily"
          print("Runtime smoke test passed.")
          PY

      - name: Snapshot protected files
        shell: bash
        run: |
          set -euo pipefail
          protected_files=(
            "scripts/generate_blocklist.py"
            "blocklist.txt"
            "portmaster.txt"
            "hagezi-overlap.txt"
          )
          snapshot="$RUNNER_TEMP/frontend-discovery-protected-sha256"
          : > "$snapshot"
          for path in "${protected_files[@]}"; do
            test -f "$path"
            printf '%s  %s\n' "$(git rev-parse "HEAD:$path")" "$path" >> "$snapshot"
          done
          echo "Protected file baseline:"
          cat "$snapshot"

      - name: Discover and validate domains
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          URLSCAN_API_KEY: ${{ secrets.URLSCAN_API_KEY }}
          DISCOVERY_MODE: daily
        run: python scripts/discover_search_frontends.py

      - name: Verify discovery outputs and protected files
        shell: bash
        run: |
          set -euo pipefail
          snapshot="$RUNNER_TEMP/frontend-discovery-protected-sha256"

          while read -r expected path; do
            actual="$(git hash-object "$path")"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::Protected file changed: $path"
              echo "Expected blob: $expected"
              echo "Actual blob:   $actual"
              git diff -- "$path" || true
              exit 1
            fi
          done < "$snapshot"

          find . -type d -name "__pycache__" -prune -exec rm -rf {} +

          mapfile -t changed < <(git status --porcelain=v1 --untracked-files=all)
          for entry in "${changed[@]}"; do
            path="${entry:3}"
            case "$path" in
              search-discovered-blocklist.txt|search-discovered-report.json) ;;
              "")
                ;;
              *)
                echo "::error::Unexpected working-tree change: $path"
                exit 1
                ;;
            esac
          done

          git diff --check

          python - <<'PY
          import json
          import re
          from pathlib import Path

          report_path = Path("search-discovered-report.json")
          output_path = Path("search-discovered-blocklist.txt")

          json.loads(report_path.read_text(encoding="utf-8"))

          bad = []
          for line_no, raw in enumerate(output_path.read_text(encoding="utf-8").splitlines(), 1):
              line = raw.strip()
              if not line or line.startswith("#"):
                  continue
              if not re.fullmatch(r"\|\|[^\^/\s]+\^", line):
                  bad.append((line_no, raw))
          assert not bad, f"Malformed discovery output lines: {bad[:5]}"
          print("Discovery outputs and protected files verified.")
          PY

      - name: Commit discovered list and report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add search-discovered-blocklist.txt search-discovered-report.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update discovered frontend domains"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            sleep 2
          done

          echo "Unable to push after 5 attempts."
          exit 1
