name: Discover frontend domains

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/discover-search-frontends.yml"
      - "scripts/discover_search_frontends.py"
  schedule:
    - cron: "41 3 * * *"

permissions:
  contents: write

concurrency:
  group: discover-search-frontends
  cancel-in-progress: true

jobs:
  discover:
    name: Frontend discovery
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate Python syntax
        run: python -m py_compile scripts/discover_search_frontends.py

      - name: Runtime smoke test
        run: |
          python - <<'PY'
          import scripts.discover_search_frontends as discovery

          candidates = {}
          discovery.merge_search_result(
              candidates,
              "twitter",
              "twitter viewer alternative to nitter",
              "bing-rss",
              {
                  "href": "https://example.com/view",
                  "title": "Twitter viewer",
                  "body": "viewer",
              },
          )
          assert ("twitter", "example.com") in candidates
          assert candidates[("twitter", "example.com")].providers == ["bing-rss"]
          queries = discovery.build_queries()
          assert queries
          assert len(queries) >= 60
          assert len(set(queries)) == len(queries)
          assert len(discovery.active_search_languages()) == 4
          assert discovery.search_pages_for("en", "twitter viewer alternatives to nitter") == (1, 2)
          import time
          rotating_lang = discovery.LANGUAGE_ROTATION[(int(time.time() // 86400) * 2) % len(discovery.LANGUAGE_ROTATION)]
          rotating_term = discovery.LANGUAGES[rotating_lang]["service"][0]
          assert discovery.search_pages_for(rotating_lang, f"twitter {rotating_term}") == (1, 2)
          assert any("X profile viewer" in q for _, platform, q in queries if platform == "twitter")
          assert any("Reddit anonymous viewer" in q for _, platform, q in queries if platform == "reddit")
          assert any("Tumblr anonymous viewer" in q for _, platform, q in queries if platform == "tumblr")
          no_signal = discovery.SearchHit(
              "example.invalid", "reddit", ["query"], ["https://example.invalid/"], [], ["bing-rss"],
              ["bing-rss:reddit comments posts"],
          )
          assert not discovery.search_hit_has_prevalidation_signal(no_signal)
          parser = discovery.PageParser()
          parser.feed(
              '<html><head><title>Reddit Viewer</title></head>'
              '<body><h1>Reddit <span>Viewer</span></h1>'
              '<div role="textbox" aria-label="Search subreddit"></div>'
              '<article>post</article></body></html>'
          )
          parsed = parser.result()
          assert "reddit viewer" in parsed["title"].lower()
          assert "reddit viewer" in parsed["headings"].lower()
          assert parsed["inputs"] >= 1
          assert parsed["article_count"] == 1

          multilingual = discovery.SearchHit(
              "example.org", "reddit", ["query"], ["https://example.org/"], [], ["bing-rss"],
              ["bing-rss:reddit 查看器 用于浏览 subreddit"],
          )
          assert discovery.search_result_has_strong_service_evidence(multilingual)
          assert discovery.DISCOVERY_MODE == "daily"
          print("Runtime smoke test passed.")
          PY

      - name: Discover and validate domains
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          URLSCAN_API_KEY: ${{ secrets.URLSCAN_API_KEY }}
          DISCOVERY_MODE: daily
        run: python scripts/discover_search_frontends.py

      - name: Guard stable blocklist files
        shell: bash
        run: |
          protected_files=(
            "scripts/generate_blocklist.py"
            "blocklist.txt"
            "portmaster.txt"
            "hagezi-overlap.txt"
          )
          if ! git diff --quiet -- "${protected_files[@]}"; then
            echo "Protected stable files changed in working tree."
            git diff -- "${protected_files[@]}"
            exit 1
          fi
          echo "Protected stable files are unchanged."

      - name: Commit discovered list and report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add search-discovered-blocklist.txt search-discovered-report.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update discovered frontend domains"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            sleep 2
          done

          echo "Unable to push after 5 attempts."
          exit 1
