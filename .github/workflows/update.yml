name: Update frontend blocklist

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update.yml"
      - "scripts/generate_blocklist.py"
  schedule:
    - cron: "17 */6 * * *"
  workflow_run:
    workflows: ["Discover frontend domains", "Deep discovery sources"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: update-frontend-blocklist
  cancel-in-progress: true

jobs:
  update:
    name: Generate AdGuard DNS blocklist
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate generator syntax
        run: python -m py_compile scripts/generate_blocklist.py

      - name: Generate blocklist
        run: python scripts/generate_blocklist.py

      - name: Commit updated list
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blocklist.txt portmaster.txt search-rules.txt hagezi-overlap.txt

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update frontend blocklist"

          # The repository can receive another commit while the sources are
          # being downloaded. Rebase before pushing and retry if necessary.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            sleep 2
          done

          echo "Unable to push after 5 attempts."
          exit 1
